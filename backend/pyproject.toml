[project]
name = "incidentiq"
version = "0.1.0"
description = "Evidence-grounded incident investigation platform"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "arq>=0.26",
    "fastapi>=0.115",
    "openai>=1.0",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "pinecone>=5.0",
    "psycopg[binary]>=3.2",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.27", "mypy>=1.15", "pytest>=8.0", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"
